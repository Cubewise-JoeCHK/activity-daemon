[package]
name = "activity-cli"
description = "activity-daemon command line interface"
version.workspace = true
edition.workspace = true

[[bin]]
name = "activity-daemon"
path = "src/main.rs"

[dependencies]
activity-core = { path = "../core" }
activity-sync = { path = "../sync" }
watcher-audio = { path = "../watcher-audio" }
watcher-screen = { path = "../watcher-screen" }
watcher-window = { path = "../watcher-window" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
# Auto-update (#17): semver compare, sha256 verification, GitHub API + asset
# downloads over the same small blocking client the sync forwarder uses.
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"

[target.'cfg(windows)'.dependencies]
# Issue #30 adds: ToolHelp (parent-process name for the hide-console auto
# heuristic), Shell (Shell_NotifyIconW tray icon), WindowsAndMessaging +
# Graphics_Gdi (message-only window, popup menu, ShowWindow, embedded icon).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
