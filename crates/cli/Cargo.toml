[package]
name = "activity-cli"
description = "activity-daemon command line interface"
version.workspace = true
edition.workspace = true

[[bin]]
name = "activity-daemon"
path = "src/main.rs"

[dependencies]
activity-core = { path = "../core" }
activity-sync = { path = "../sync" }
watcher-audio = { path = "../watcher-audio" }
watcher-screen = { path = "../watcher-screen" }
watcher-window = { path = "../watcher-window" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
