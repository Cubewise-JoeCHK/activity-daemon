[package]
name = "activity-cli"
description = "activity-daemon command line interface"
version.workspace = true
edition.workspace = true

[[bin]]
name = "activity-daemon"
path = "src/main.rs"

[dependencies]
activity-core = { path = "../core" }
activity-sync = { path = "../sync" }
activity-update = { path = "../update" }
watcher-audio = { path = "../watcher-audio" }
watcher-screen = { path = "../watcher-screen" }
watcher-window = { path = "../watcher-window" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
# Auto-update (#17): semver compare; release check + sha256 verification and
# the GitHub API + asset downloads live in activity-update (#32, shared with
# the hub updater).
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Issue #30 adds: ToolHelp (parent-process name for the hide-console auto
# heuristic), Shell (Shell_NotifyIconW tray icon), WindowsAndMessaging +
# Graphics_Gdi (message-only window, popup menu, ShowWindow, embedded icon).
# Issue #35 adds: Registry (SystemUsesLightTheme picks the tray's dark- or
# light-bg icon set).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Issue #35: embed assets/activity-daemon.ico as the exe icon (Explorer /
# taskbar / shortcuts). Windows targets only - the build script no-ops
# elsewhere, so the ubuntu CI leg needs no resource compiler.
winresource = "0.1"
