[package]
name = "watcher-screen"
description = "Screen frame watcher: deduped JPEG capture with rolling retention for activity-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
activity-core = { path = "../core" }
anyhow = "1"
chrono = "0.4"
jpeg-encoder = "0.7"
log = "0.4"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
