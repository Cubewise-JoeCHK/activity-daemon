[package]
name = "server"
description = "WSL central ingestion server for activity-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
activity-core = { path = "../core" }
axum = "0.8"
refiner-timesheet = { path = "../refiner-timesheet" }
# Same time crate (and feature set) as core: the web API needs local-timezone
# day boundaries for "active today" and calendar day bucketing.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Logger backend for the hub binary: the timesheet refiner (and other
# library code) logs via `log`; without a backend those lines go nowhere.
env_logger = "0.11"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Issue #38: monthly retention bundles are POSIX tar archives, zstd-compressed.
tar = "0.4"
# "sync" added for the shared shutdown watch channel (timesheet worker, #43).
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "io-util", "signal", "sync", "time"] }
# Issue #39: the minio move stage streams bundle chunks through
# futures::StreamExt and object_store's S3 client (MinIO over path-style S3).
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
object_store = { version = "0.14", features = ["aws"] }
# Same TOML crate (major) as core's config parser; the server config file
# carries the `[retention]` and `[timesheet]` sections.
toml = "1"
zstd = "0.13"

[dev-dependencies]
# Sync contract v2 integration tests (#40): the real client forwarder
# against the real hub router over loopback HTTP.
activity-sync = { path = "../sync" }
calamine = "0.38.0"
tower = { version = "0.5", features = ["util"] }
