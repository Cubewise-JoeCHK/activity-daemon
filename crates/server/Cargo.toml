[package]
name = "server"
description = "WSL central ingestion server for activity-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
activity-core = { path = "../core" }
axum = "0.8"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "io-util", "signal", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
