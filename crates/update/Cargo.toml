[package]
name = "activity-update"
description = "Shared GitHub release check + sha256 verification for activity-daemon auto-updates"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
