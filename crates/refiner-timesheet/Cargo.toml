[package]
name = "refiner-timesheet"
description = "Hub-side Timesheet AI pipeline (question queue storage) for activity-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
activity-core = { path = "../core" }
# Same time crate (and feature set) as core: created_at/answered_at are
# RFC3339 UTC stamps in the same convention as media index rows.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lemonade titling (issue #45): small blocking HTTP client, same crate and
# feature set as the sync forwarder (plain loop, builds on Windows + Linux).
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
# Config-section tests parse [timesheet] TOML bodies (same major as the
# server/core config parsers).
toml = "1"
