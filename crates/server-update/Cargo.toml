[package]
name = "activity-server-update"
description = "Hub updater: keeps the WSL activity-server container current from GitHub Releases"
version.workspace = true
edition.workspace = true

[lib]
name = "activity_server_update"
path = "src/lib.rs"

[[bin]]
name = "activity-server-update"
path = "src/main.rs"

[dependencies]
activity-update = { path = "../update" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
